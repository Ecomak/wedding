# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["dev"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Encrypt site with Staticrypt
        run: |
          # 1. Create a clean temporary output directory
          mkdir -p final_output
          
          # 2. Run staticrypt and tell it EXACTLY where to put the result
          # Using the environment variable is the most stable method
          npx staticrypt dist/index.html --short --directory final_output
          
          # 3. List the contents of that directory to confirm the file exists
          echo "Checking final_output contents:"
          ls -R final_output
          
          # 4. Move the encrypted file into your dist folder
          if [ -f "final_output/index.html" ]; then
            cp final_output/index.html dist/index.html
            echo "Success: Encrypted file moved to dist/index.html"
          else
            echo "Error: Encrypted file was not created in final_output!"
            exit 1
          fi
          
          # 5. Final verification (look for 'staticrypt' in the file)
          echo "--- START OF FILE ---"
          head -c 100 dist/index.html
        env:
          STATICRYPT_PASSWORD: ${{ secrets.SITE_PASSWORD }}

    
            
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
