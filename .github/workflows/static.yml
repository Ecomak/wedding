# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["dev"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Encrypt site with Staticrypt
        run: |
          # 1. Use the locally installed package in node_modules
          # We use the STATICRYPT_PASSWORD env var which the tool looks for automatically
          ./node_modules/.bin/staticrypt dist/index.html -r -s --title "Protected Site"
          
          # 2. Check if it created the 'encrypted' folder (common v3.x behavior)
          if [ -d "dist/encrypted" ]; then
            echo "Found encrypted folder, moving file..."
            mv dist/encrypted/index.html dist/index.html
          fi

          # 3. VERIFICATION: Look for the word 'password' or 'crypto' in the file
          echo "--- FILE CHECK ---"
          grep -i "password" dist/index.html | head -c 100
        env:
          STATICRYPT_PASSWORD: ${{ secrets.SITE_PASSWORD }}

    
            
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
