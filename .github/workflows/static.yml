# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["dev"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Encrypt site with Staticrypt
        run: |
          # --stdout tells staticrypt to output the encrypted HTML code instead of saving a file
          # > dist/index.html tells the shell to take that output and overwrite your file
          npx staticrypt dist/index.html -p "${{ secrets.SITE_PASSWORD }}" -s --stdout > dist/index.html
          
          # Verification: Check if the file now contains the encryption engine
          echo "--- VERIFYING ENCRYPTION ---"
          if grep -q "staticrypt" dist/index.html; then
            echo "Success: dist/index.html is now encrypted."
          else
            echo "Error: dist/index.html does not contain encrypted data."
            exit 1
          fi
            
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
