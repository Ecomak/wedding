# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["dev"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Encrypt site with Staticrypt
        run: |
          # 1. We use -f to force the output filename. 
          # We'll output to a different name first to be safe.
          npx staticrypt dist/index.html -p "${{ secrets.SITE_PASSWORD }}" -s -f "encrypted.html"
          
          # 2. Find where it put it and move it to dist/index.html
          # StatiCrypt usually puts the -f file in the same directory as the input
          if [ -f "dist/encrypted.html" ]; then
            mv dist/encrypted.html dist/index.html
            echo "Success: Moved from dist/encrypted.html"
          elif [ -f "encrypted.html" ]; then
            mv encrypted.html dist/index.html
            echo "Success: Moved from root encrypted.html"
          else
            echo "Error: encrypted.html not found anywhere!"
            exit 1
          fi

          # 3. Double check the file is actually HTML now
          echo "--- START OF FILE ---"
          head -c 100 dist/index.html
          echo -e "\n--- END ---"

    
            
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
