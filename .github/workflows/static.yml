# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["dev"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Encrypt site with Staticrypt
        run: |
          # 1. Run the encryption
          npx staticrypt dist/index.html -p "${{ secrets.SITE_PASSWORD }}" -s --title "Protected Site"
          
          # 2. DEBUG: List all files to see where it went (this helps if it fails again)
          echo "Searching for the encrypted file..."
          find . -name "index.html"
          
          # 3. Use the find command to move the encrypted file to dist/index.html
          # We search for index.html but exclude the one already in dist/ and any in node_modules
          ENCRYPTED_FILE=$(find . -path "*/encrypted/index.html" | head -n 1)
          
          if [ -z "$ENCRYPTED_FILE" ]; then
            echo "Error: Could not find the encrypted file!"
            exit 1
          else
            echo "Found encrypted file at: $ENCRYPTED_FILE"
            mv "$ENCRYPTED_FILE" dist/index.html
          fi
            
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
