# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["dev"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Encrypt site with Staticrypt
        run: |
          # 1. Move into the dist folder so we are working directly on the file
          cd dist
          
          # 2. Run staticrypt directly on index.html with the replace flag
          # We use --overwrite to force it to replace the file in place
          npx staticrypt index.html -p "${{ secrets.SITE_PASSWORD }}" -s -r --overwrite
          
          # 3. If that created an 'encrypted' folder instead of replacing, move it back
          if [ -f "encrypted/index.html" ]; then
            mv encrypted/index.html index.html
          fi
          
          # 4. BIG REVEAL: List everything in dist so we can see what happened
          echo "--- Current folder content ---"
          ls -R
          
          # 5. Check if the file is actually encrypted now
          echo "--- First 50 characters of index.html ---"
          head -c 50 index.html

    
            
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
