# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["dev"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Encrypt site with Staticrypt
        run: |
          # 1. Encrypt to a temporary file instead of directly overwriting
          npx staticrypt dist/index.html --password "${{ secrets.SITE_PASSWORD }}" -s --stdout > dist/temp_encrypted.html
          
          # 2. Check if the temp file actually has content
          if [ -s dist/temp_encrypted.html ]; then
            echo "Encryption successful, replacing original index.html"
            mv dist/temp_encrypted.html dist/index.html
          else
            echo "Error: Encrypted output is empty!"
            exit 1
          fi
          
          # 3. Final Verification
          echo "--- VERIFYING FILE CONTENT ---"
          head -n 20 dist/index.html

    
            
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
