# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["dev"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Encrypt site with Staticrypt
        run: |
          cd dist
          # 1. We run with the most explicit flags possible
          # We output to 'encrypted.html' specifically
          npx staticrypt index.html --password "${{ secrets.SITE_PASSWORD }}" --short --output . --name "encrypted"
          
          # 2. Check if the new file exists. If not, try the 'stdout' pipe again but with a FIX
          if [ -f "encrypted.html" ]; then
            mv encrypted.html index.html
            echo "Success: Created encrypted.html and replaced index.html"
          else
            echo "Standard method failed, trying the pipe method..."
            npx staticrypt index.html --password "${{ secrets.SITE_PASSWORD }}" --short --stdout > encrypted_pipe.html
            mv encrypted_pipe.html index.html
          fi

          # 3. VERIFICATION
          echo "--- VERIFYING FILE CONTENT ---"
          head -c 100 index.html

    
            
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
